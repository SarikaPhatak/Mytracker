<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Tracker</title>
    
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
        color: #667eea;
        text-align: center;
        margin-bottom: 30px;
    }

    .section-heading {
    color: #667eea;
    margin: 20px 0 15px 0;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #667eea;
    }

    textarea {
        resize: vertical;
        min-height: 60px;
    }

    .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .summary-card {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        padding: 20px;
        border-radius: 12px;
        text-align: center;
    }

    .summary-label {
        font-size: 12px;
        color: #666;
        margin-bottom: 5px;
    }

    .summary-value {
        font-size: 24px;
        font-weight: bold;
        color: #667eea;
    }

    .food-item {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 15px;
        border-left: 4px solid #667eea;
    }

    .food-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 10px;
    }

    .food-name {
        font-size: 18px;
        font-weight: bold;
        color: #667eea;
    }

    .meal-badge {
        background: #667eea;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
    }

    .food-details {
        color: #666;
        font-size: 14px;
        line-height: 1.8;
    }

    .empty-state {
        text-align: center;
        padding: 40px;
        color: #999;
    }

    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        border-bottom: 2px solid #e0e0e0;
    }

    .tab {
        padding: 12px 24px;
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        color: #666;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .tab:hover {
        color: #667eea;
    }

    .tab.active {
        color: #667eea;
        border-bottom-color: #667eea;
    }

    .tab-content {
        display: none;
    }

    .tab-content.active {
        display: block;
    }

    .search-btn {
    padding: 12px 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    }

    .search-btn:hover {
    background: #218838;
    }
</style>

</head>

<body>
    <div class="container">
    <h1>🍽️ Food Tracker</h1>

    <div class="tabs">
    <button class="tab active" onclick="showTab('log')">Log Food</button>
    <button class="tab" onclick="showTab('summary')">Summary</button>
    <button class="tab" onclick="showTab('history')">History</button>
    <button class="tab" onclick="showTab('library')">📚 Food Library</button>
</div>

    <div id="logTab" class="tab-content active">
    
    <form id="foodForm">
        <div class="form-group">
            <label>Date & Time</label>
            <input type="datetime-local" id="datetime" required>
        </div>
        
        <div class="form-group">
    <label>Food Name</label>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="foodName" placeholder="e.g., Roti, Dal, Rice" required style="flex: 1;">
        <button type="button" onclick="searchNutrition()" class="search-btn">🔍 Search</button>
    </div>
    </div>
        
        <div class="form-group">
        <label>Portion Size <span style="color: red;">*</span></label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="portionAmount" placeholder="e.g. 2" min="0.1" step="0.1" required style="flex: 1;">
            <select id="portionUnit" required style="flex: 1;">
                <option value="">Select unit</option>
                <option value="pieces">Pieces</option>
                <option value="grams">Grams</option>
                <option value="cup">Cup</option>
                <option value="bowl">Bowl</option>
                <option value="tbsp">Tbsp</option>
                <option value="tsp">Tsp</option>
            </select>
        </div>
    </div>

        <div class="form-group">
            <label>Meal Type</label>
            <select id="mealType" required>
              <option value="">Select meal type</option>
              <option value="Breakfast">🌅 Breakfast</option>
              <option value="Morning Snack">☕ Morning Snack</option>
              <option value="Lunch">🍱 Lunch</option>
              <option value="Afternoon Snack">🍪 Afternoon Snack</option>
              <option value="Dinner">🌙 Dinner</option>
              <option value="Late Night Snack">🌃 Late Night Snack</option>
            </select>
        </div>
        
        <h3 class="section-heading">Macros</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            
        <div class="form-group">
            <label>Calories (kcal) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="calories" placeholder="0">
        </div>

        <div class="form-group">
            <label>Protein (g) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="protein" placeholder="0" step="0.1">
        </div>

        <div class="form-group">
            <label>Carbs (g) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="carbs" placeholder="0" step="0.1">
        </div>

        <div class="form-group">
            <label>Fats (g) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="fats" placeholder="0" step="0.1">
        </div>

        <div class="form-group">
            <label>Fiber (g) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="fiber" placeholder="0" step="0.1">
        </div>
        </div>        
        <div class="form-group">
            <label>Notes (Optional)</label>
            <textarea id="notes" placeholder="Meal type, how you felt, etc."></textarea>
        </div>

        <div id="saveNutritionBar" style="display: none; background: #f0f7ff; border: 2px solid #667eea; border-radius: 10px; padding: 15px; margin-bottom: 20px;">
        <p style="margin-bottom: 10px; color: #333; font-weight: 600;">💾 Save this food to your database for future use?</p>
        <div style="display: flex; gap: 10px;">
            <button type="button" onclick="saveToDatabase()" class="search-btn">✅ Save to My Database</button>
            <button type="button" onclick="dismissSaveBar()" style="padding: 12px 20px; background: #ccc; border: none; border-radius: 10px; cursor: pointer;">❌ No Thanks</button>
        </div>
    </div>
        
        <button type="submit" class="btn">Log Food</button>
    </form>
 </div>
        
    <div id="summaryTab" class="tab-content">
        <h2 style="color: #333; margin-bottom: 20px;">Today's Summary</h2>
        <div id="dailySummary"></div>
    </div>

    <div id="historyTab" class="tab-content">
        <h2 style="color: #333; margin-bottom: 20px;">Food History</h2>
        <div id="foodsList"></div>
    </div>

    <div id="libraryTab" class="tab-content">
    <h2 style="color: #333; margin-bottom: 20px;">📚 Food Library</h2>

    <!-- Add New Food Form -->
    <div style="background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 25px;">
        <h3 style="color: #667eea; margin-bottom: 15px;">Add New Food</h3>
        
        <div class="form-group">
            <label>Food Name</label>
            <input type="text" id="libraryFoodName" placeholder="e.g. Roti, Poha, Rice">
        </div>

        <div class="form-group">
            <label>Base Portion Unit</label>
            <select id="libraryUnit">
                <option value="">Select unit</option>
                <option value="pieces">Pieces</option>
                <option value="grams">Grams</option>
                <option value="cup">Cup</option>
                <option value="bowl">Bowl</option>
                <option value="tbsp">Tbsp</option>
                <option value="tsp">Tsp</option>
            </select>
        </div>

        <h4 style="color: #333; margin-bottom: 10px;">Nutrition per 1 unit (or 100g for grams)</h4>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>Calories (kcal)</label>
                <input type="number" id="libraryCalories" placeholder="0">
            </div>
            <div class="form-group">
                <label>Protein (g)</label>
                <input type="number" id="libraryProtein" placeholder="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Carbs (g)</label>
                <input type="number" id="libraryCarbs" placeholder="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Fats (g)</label>
                <input type="number" id="libraryFats" placeholder="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Fiber (g)</label>
                <input type="number" id="libraryFiber" placeholder="0" step="0.1">
            </div>
        </div>

        <button type="button" onclick="addToLibrary()" class="btn">➕ Add to Library</button>
    </div>

        <!-- Food Library List -->
        <div id="libraryList"></div>
    </div>
 
</div>

    


 <script>
    // Tab switching functionality
    function showTab(tabName) {
        // Hide all tab contents
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        
        // Remove active class from all tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });
        
        // Show selected tab content
        document.getElementById(tabName + 'Tab').classList.add('active');
        
        // Add active class to clicked tab
        event.target.classList.add('active');
    }

    async function searchNutrition() {
        const foodName = document.getElementById('foodName').value.trim();
        
        if (!foodName) {
            alert('Please enter a food name first!');
            return;
        }
        
        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
        
        if (savedNutrition[foodName.toLowerCase()]) {
            const nutrition = savedNutrition[foodName.toLowerCase()];
            fillNutritionFields(nutrition);
            alert('Found in your saved foods! ✅');
            return;
        }
        
        document.getElementById('saveNutritionBar').style.display = 'block';
        alert('Food not found in your database! Fill in the nutrition fields manually and save it for future use.');
    }

    function fillNutritionFields(nutrition) {
        document.getElementById('calories').value = nutrition.calories || 0;
        document.getElementById('protein').value = nutrition.protein || 0;
        document.getElementById('carbs').value = nutrition.carbs || 0;
        document.getElementById('fats').value = nutrition.fats || 0;
        document.getElementById('fiber').value = nutrition.fiber || 0;
        document.getElementById('saveNutritionBar').style.display = 'block';
    }



    function dismissSaveBar() {
        document.getElementById('saveNutritionBar').style.display = 'none';
    }

    function saveToDatabase() {
        const foodName = document.getElementById('foodName').value.trim();
        const portionUnit = document.getElementById('portionUnit').value;

        if (!portionUnit) {
            alert('Please select a portion unit before saving!');
            return;
        }

        if (!foodName) {
            alert('Please enter a food name first!');
            return;
        }

        const baseAmount = portionUnit === 'grams' ? 100 : 1;

        const nutrition = {
            unit: portionUnit,
            baseAmount: baseAmount,
            calories: parseFloat(document.getElementById('calories').value) || 0,
            protein: parseFloat(document.getElementById('protein').value) || 0,
            carbs: parseFloat(document.getElementById('carbs').value) || 0,
            fats: parseFloat(document.getElementById('fats').value) || 0,
            fiber: parseFloat(document.getElementById('fiber').value) || 0
        };

        if (nutrition.calories === 0) {
            alert('Please enter at least the calories before saving!');
            return;
        }

        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
        savedNutrition[foodName.toLowerCase()] = nutrition;
        localStorage.setItem('nutritionDatabase', JSON.stringify(savedNutrition));

        document.getElementById('saveNutritionBar').style.display = 'none';
        alert(`"${foodName}" saved to your database! ✅ Next time you search it, it will auto-fill.`);
    }
    // Set current date and time as default
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('datetime').value = `${year}-${month}-${day}T${hours}:${minutes}`;

    // Initialize foods array
    let foods = JSON.parse(localStorage.getItem('foods')) || [];

    // Handle form submission
    document.getElementById('foodForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const food = {
            id: Date.now(),
            datetime: document.getElementById('datetime').value,
            name: document.getElementById('foodName').value,
            portionAmount: document.getElementById('portionAmount').value,
            portionUnit: document.getElementById('portionUnit').value,
            mealType: document.getElementById('mealType').value,
            calories: parseFloat(document.getElementById('calories').value) || 0,
            protein: parseFloat(document.getElementById('protein').value) || 0,
            carbs: parseFloat(document.getElementById('carbs').value) || 0,
            fats: parseFloat(document.getElementById('fats').value) || 0,
            fiber: parseFloat(document.getElementById('fiber').value) || 0,
            notes: document.getElementById('notes').value
        };
        
        foods.unshift(food);
        localStorage.setItem('foods', JSON.stringify(foods));
        
        this.reset();
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('datetime').value = `${year}-${month}-${day}T${hours}:${minutes}`;
        
        alert('Food logged! 🍽️');
    });

    // ============================
// FOOD LIBRARY CRUD FUNCTIONS
// ============================

// READ - Render all foods in the library
function renderLibrary() {
    const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
    const libraryList = document.getElementById('libraryList');

    // If library is empty show a message
    if (Object.keys(savedNutrition).length === 0) {
        libraryList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No foods in your library yet. Add one above!</p>';
        return;
    }

    // Build HTML for each food
    let html = '';
    for (const foodName in savedNutrition) {
        const food = savedNutrition[foodName];
        html += `
            <div class="food-item" id="library-${foodName}">
                <div class="food-header">
                    <span class="food-name">${foodName}</span>
                    <span class="meal-badge">${food.baseAmount} ${food.unit}</span>
                </div>
                <div class="food-details">
                    🔥 ${food.calories} kcal &nbsp;|&nbsp;
                    💪 ${food.protein}g protein &nbsp;|&nbsp;
                    🍚 ${food.carbs}g carbs &nbsp;|&nbsp;
                    🧈 ${food.fats}g fats &nbsp;|&nbsp;
                    🌾 ${food.fiber || 0}g fiber
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="editFood('${foodName}')" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">✏️ Edit</button>
                    <button onclick="deleteFood('${foodName}')" style="padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 8px; cursor: pointer;">🗑️ Delete</button>
                </div>
            </div>
        `;
    }
    libraryList.innerHTML = html;
}

// CREATE - Add a new food to the library
function addToLibrary() {
    const foodName = document.getElementById('libraryFoodName').value.trim();
    const unit = document.getElementById('libraryUnit').value;
    const calories = parseFloat(document.getElementById('libraryCalories').value) || 0;
    const protein = parseFloat(document.getElementById('libraryProtein').value) || 0;
    const carbs = parseFloat(document.getElementById('libraryCarbs').value) || 0;
    const fats = parseFloat(document.getElementById('libraryFats').value) || 0;
    const fiber = parseFloat(document.getElementById('libraryFiber').value) || 0;

    // Validate
    if (!foodName) { alert('Please enter a food name!'); return; }
    if (!unit) { alert('Please select a unit!'); return; }
    if (calories === 0) { alert('Please enter at least the calories!'); return; }

    const baseAmount = unit === 'grams' ? 100 : 1;

    // Get existing database
    const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};

    // Check if food already exists
    if (savedNutrition[foodName.toLowerCase()]) {
        const overwrite = confirm(`"${foodName}" already exists in your library. Do you want to overwrite it?`);
        if (!overwrite) return;
    }

    // Save to database
    savedNutrition[foodName.toLowerCase()] = { unit, baseAmount, calories, protein, carbs, fats, fiber };
    localStorage.setItem('nutritionDatabase', JSON.stringify(savedNutrition));

    // Clear the form fields
    document.getElementById('libraryFoodName').value = '';
    document.getElementById('libraryUnit').value = '';
    document.getElementById('libraryCalories').value = '';
    document.getElementById('libraryProtein').value = '';
    document.getElementById('libraryCarbs').value = '';
    document.getElementById('libraryFats').value = '';
    document.getElementById('libraryFiber').value = '';

    alert(`"${foodName}" added to your Food Library! 📚`);

    // Refresh the list
    renderLibrary();
}

// DELETE - Remove a food from the library
function deleteFood(foodName) {
    const confirm1 = confirm(`Are you sure you want to delete "${foodName}" from your library?`);
    if (!confirm1) return;

    const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
    delete savedNutrition[foodName];
    localStorage.setItem('nutritionDatabase', JSON.stringify(savedNutrition));

    alert(`"${foodName}" deleted from your library!`);
    renderLibrary();
}

// EDIT - Fill the form with existing food data so user can update it
function editFood(foodName) {
    const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
    const food = savedNutrition[foodName];

    // Fill the add form with existing values
    document.getElementById('libraryFoodName').value = foodName;
    document.getElementById('libraryUnit').value = food.unit;
    document.getElementById('libraryCalories').value = food.calories;
    document.getElementById('libraryProtein').value = food.protein;
    document.getElementById('libraryCarbs').value = food.carbs;
    document.getElementById('libraryFats').value = food.fats;
    document.getElementById('libraryFiber').value = food.fiber || 0;

    // Delete the old entry so it gets replaced when saved
    delete savedNutrition[foodName];
    localStorage.setItem('nutritionDatabase', JSON.stringify(savedNutrition));
    renderLibrary();

    // Scroll to the form so user can see it
    document.getElementById('libraryFoodName').scrollIntoView({ behavior: 'smooth' });
    alert(`Editing "${foodName}" - make your changes and click Add to Library to save!`);
}

function showTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
    });
    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
    });
    document.getElementById(tabName + 'Tab').classList.add('active');
    event.target.classList.add('active');

    // If switching to library tab, render the list
    if (tabName === 'library') {
        renderLibrary();
    }
}
</script>
</body>
</html>
