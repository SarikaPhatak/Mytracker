<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
        color: #667eea;
        text-align: center;
        margin-bottom: 30px;
    }

    .section-heading {
    color: #667eea;
    margin: 20px 0 15px 0;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 25px;
        font-size: 16px;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #667eea;
    }

    textarea {
        resize: vertical;
        min-height: 60px;
    }

    .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .summary-card {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        padding: 20px;
        border-radius: 12px;
        text-align: center;
    }

    .summary-label {
        font-size: 12px;
        color: #666;
        margin-bottom: 5px;
    }

    .summary-value {
        font-size: 24px;
        font-weight: bold;
        color: #667eea;
    }

    .food-item {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 15px;
        border-left: 4px solid #667eea;
    }

    .food-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 10px;
    }

    .food-name {
        font-size: 18px;
        font-weight: bold;
        color: #667eea;
    }

    .meal-badge {
        background: #667eea;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
    }

    .food-details {
        color: #666;
        font-size: 14px;
        line-height: 1.8;
    }

    .empty-state {
        text-align: center;
        padding: 40px;
        color: #999;
    }

    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        border-bottom: 2px solid #e0e0e0;
    }

    .tab {
        padding: 12px 24px;
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        color: #666;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .tab:hover {
        color: #667eea;
    }

    .tab.active {
        color: #667eea;
        border-bottom-color: #667eea;
    }

    .tab-content {
        display: none;
    }

    .tab-content.active {
        display: block;
    }

    .search-btn {
    padding: 12px 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    }

    .search-btn:hover {
    background: #218838;
    }
</style>

</head>

<body>
    <div class="container">
    <h1>🍽️ Food Tracker</h1>

    <div class="tabs">
    <button class="tab active" onclick="showTab('log')">Log Food</button>
    <button class="tab" onclick="showTab('summary')">Summary</button>
    <button class="tab" onclick="showTab('history')">History</button>
    <button class="tab" onclick="showTab('library')">📚 Food Library</button>
</div>

    <div id="logTab" class="tab-content active">
    
    <form id="foodForm">
        <div class="form-group">
            <label>Date</label>
            <input type="text" id="datetime" placeholder="Select date..." required readonly>
        </div>
        
       <div class="form-group">
        <label>Food Name</label>
        <div style="position: relative;">
            <input type="text" id="foodName" placeholder="e.g., Roti, Dal, Rice" required oninput="searchLibrary()" autocomplete="off">
            <!-- Dropdown suggestions -->
            <div id="foodSuggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 2px solid #667eea; border-radius: 12px; z-index: 100; max-height: 200px; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1);"></div>
        </div>
    </div>
        
        <div class="form-group">
        <label>Portion Size <span style="color: red;">*</span></label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="portionAmount" placeholder="e.g. 2" min="0.1" step="0.1" required style="flex: 1;" oninput="recalculateMacros()">
            <select id="portionUnit" required style="flex: 1;">
                <option value="">Select unit</option>
                <option value="pieces">Pieces</option>
                <option value="grams">Grams</option>
                <option value="cup">Cup</option>
                <option value="bowl">Bowl</option>
                <option value="tbsp">Tbsp</option>
                <option value="tsp">Tsp</option>
            </select>
        </div>
    </div>

        <div class="form-group">
            <label>Meal Type</label>
            <select id="mealType" required>
              <option value="">Select meal type</option>
              <option value="Breakfast">🌅 Breakfast</option>
              <option value="Morning Snack">☕ Morning Snack</option>
              <option value="Lunch">🍱 Lunch</option>
              <option value="Afternoon Snack">🍪 Afternoon Snack</option>
              <option value="Dinner">🌙 Dinner</option>
              <option value="Late Night Snack">🌃 Late Night Snack</option>
            </select>
        </div>
        
        <h3 class="section-heading">Macros</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">

        <div class="form-group">
            <label>Calories (kcal) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="calories" placeholder="0">
        </div>

        <div class="form-group">
            <label>Protein (g) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="protein" placeholder="0" step="0.1">
        </div>

        <div class="form-group">
            <label>Carbs (g) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="carbs" placeholder="0" step="0.1">
        </div>

        <div class="form-group">
            <label>Fats (g) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="fats" placeholder="0" step="0.1">
        </div>

        <div class="form-group">
            <label>Fiber (g) <span style="color: #999; font-size: 12px;">(Optional)</span></label>
            <input type="number" id="fiber" placeholder="0" step="0.1">
        </div>
        </div>        
        <div class="form-group">
            <label>Notes (Optional)</label>
            <textarea id="notes" placeholder="Meal type, how you felt, etc."></textarea>
        </div>

        <div id="saveNutritionBar" style="display: none; background: #f0f7ff; border: 2px solid #667eea; border-radius: 10px; padding: 15px; margin-bottom: 20px;">
        <p style="margin-bottom: 10px; color: #333; font-weight: 600;">💾 Save this food to your database for future use?</p>
        <div style="display: flex; gap: 10px;">
            <button type="button" onclick="saveToDatabase()" class="search-btn">✅ Save to My Database</button>
            <button type="button" onclick="dismissSaveBar()" style="padding: 12px 20px; background: #ccc; border: none; border-radius: 10px; cursor: pointer;">❌ No Thanks</button>
        </div>
    </div>
        
        <button type="submit" class="btn">Log Food</button>
    </form>
 </div>
        
    <div id="summaryTab" class="tab-content">
    <h2 style="color: #333; margin-bottom: 20px;">Today's Summary</h2>

    <!-- Goals Section -->
    <div style="background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 25px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="color: #667eea;">⚙️ My Daily Goals</h3>
            <button type="button" onclick="toggleGoalsForm()" id="goalsToggleBtn" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 25px; cursor: pointer;">✏️ Edit Goals</button>
        </div>

        <!-- Goals Form - hidden by default -->
        <div id="goalsForm" style="display: none;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>🔥 Calories (kcal)</label>
                    <input type="number" id="goalCalories" placeholder="e.g. 2000">
                </div>
                <div class="form-group">
                    <label>💪 Protein (g)</label>
                    <input type="number" id="goalProtein" placeholder="e.g. 100">
                </div>
                <div class="form-group">
                    <label>🍚 Carbs (g)</label>
                    <input type="number" id="goalCarbs" placeholder="e.g. 250">
                </div>
                <div class="form-group">
                    <label>🧈 Fats (g)</label>
                    <input type="number" id="goalFats" placeholder="e.g. 65">
                </div>
                <div class="form-group">
                    <label>🌾 Fiber (g)</label>
                    <input type="number" id="goalFiber" placeholder="e.g. 30">
                </div>
            </div>
            <button type="button" onclick="saveGoals()" class="btn">💾 Save Goals</button>
        </div>

        <!-- Goals Display -->
        <div id="goalsDisplay"></div>
    </div>

        <!-- Daily Summary -->
        <div id="dailySummary"></div>
    </div>

    <div id="historyTab" class="tab-content">
    <h2 style="color: #333; margin-bottom: 20px;">Food History</h2>

    <!-- Calendar -->
    <div style="background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 25px;">
        
        <!-- Calendar Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button type="button" onclick="changeMonth(-1)" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 25px; cursor: pointer;">← Prev</button>
            <h3 id="calendarTitle" style="color: #667eea;"></h3>
            <button type="button" onclick="changeMonth(1)" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 25px; cursor: pointer;">Next →</button>
        </div>

        <!-- Day Labels -->
        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px;">
            <div style="text-align: center; font-weight: 600; color: #666; font-size: 12px;">Mon</div>
            <div style="text-align: center; font-weight: 600; color: #666; font-size: 12px;">Tue</div>
            <div style="text-align: center; font-weight: 600; color: #666; font-size: 12px;">Wed</div>
            <div style="text-align: center; font-weight: 600; color: #666; font-size: 12px;">Thu</div>
            <div style="text-align: center; font-weight: 600; color: #666; font-size: 12px;">Fri</div>
            <div style="text-align: center; font-weight: 600; color: #666; font-size: 12px;">Sat</div>
            <div style="text-align: center; font-weight: 600; color: #666; font-size: 12px;">Sun</div>
        </div>

        <!-- Calendar Grid -->
        <div id="calendarGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;"></div>

        <!-- Legend -->
        <div style="display: flex; gap: 15px; margin-top: 15px; font-size: 12px; color: #666;">
            <span>🟢 Food logged</span>
            <span>🔴 Missed</span>
            <span>⬜ Future</span>
        </div>
    </div>

        <!-- Food List -->
        <div id="foodsList"></div>
    </div>

    <div id="libraryTab" class="tab-content">
    <h2 style="color: #333; margin-bottom: 20px;">📚 Food Library</h2>

    <!-- Add New Food Form -->
    <div style="background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 25px;">
        <h3 style="color: #667eea; margin-bottom: 15px;">Add New Food</h3>
        
        <div class="form-group">
            <label>Food Name</label>
            <input type="text" id="libraryFoodName" placeholder="e.g. Roti, Poha, Rice">
        </div>

        <div class="form-group">
            <label>Base Portion Unit</label>
            <select id="libraryUnit">
                <option value="">Select unit</option>
                <option value="pieces">Pieces</option>
                <option value="grams">Grams</option>
                <option value="cup">Cup</option>
                <option value="bowl">Bowl</option>
                <option value="tbsp">Tbsp</option>
                <option value="tsp">Tsp</option>
            </select>
        </div>

        <h4 style="color: #333; margin-bottom: 10px;">Nutrition per 1 unit (or 100g for grams)</h4>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>Calories (kcal)</label>
                <input type="number" id="libraryCalories" placeholder="0">
            </div>
            <div class="form-group">
                <label>Protein (g)</label>
                <input type="number" id="libraryProtein" placeholder="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Carbs (g)</label>
                <input type="number" id="libraryCarbs" placeholder="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Fats (g)</label>
                <input type="number" id="libraryFats" placeholder="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Fiber (g)</label>
                <input type="number" id="libraryFiber" placeholder="0" step="0.1">
            </div>
        </div>

        <button type="button" onclick="addToLibrary()" class="btn">➕ Add to Library</button>
    </div>

        <!-- Search Bar -->
    <div class="form-group">
        <input type="text" id="librarySearch" placeholder="🔍 Search your food library..." oninput="renderLibrary()">
    </div>
        <!-- Food Library List -->
        <div id="libraryList"></div>
    </div>
 
</div>
    

<script>
    // ============================
    // TAB SWITCHING
    // ============================
    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.getElementById(tabName + 'Tab').classList.add('active');
        event.target.classList.add('active');

        if (tabName === 'library') renderLibrary();
        if (tabName === 'history') { renderHistory(); renderCalendar(); }
        if (tabName === 'summary') renderSummary();
    }

    // ============================
    // AUTOCOMPLETE FUNCTIONS
    // ============================
    let selectedFoodBase = null;

    function searchLibrary() {
        const input = document.getElementById('foodName').value.trim().toLowerCase();
        const suggestions = document.getElementById('foodSuggestions');
        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};

        if (input.length === 0) {
            suggestions.style.display = 'none';
            return;
        }

        const matches = Object.keys(savedNutrition).filter(food =>
            food.toLowerCase().includes(input)
        );

        if (matches.length === 0) {
            suggestions.style.display = 'block';
            suggestions.innerHTML = `
                <div style="padding: 12px 15px; color: #999; font-size: 14px;">
                    🔍 Food not found in library.
                    <a href="#" onclick="goToLibrary()" style="color: #667eea; font-weight: 600;">Save to Food Library</a>
                </div>
            `;
            return;
        }

        let html = '';
        matches.forEach(foodName => {
            const food = savedNutrition[foodName];
            html += `
                <div onclick="selectFood('${foodName}')" style="padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0;" onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='white'">
                    <div style="font-weight: 600; color: #333;">${foodName}</div>
                    <div style="font-size: 12px; color: #999;">🔥 ${food.calories} kcal per ${food.baseAmount} ${food.unit}</div>
                </div>
            `;
        });

        suggestions.style.display = 'block';
        suggestions.innerHTML = html;
    }

    function selectFood(foodName) {
        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
        const food = savedNutrition[foodName];

        selectedFoodBase = food;

        document.getElementById('foodName').value = foodName;
        document.getElementById('portionUnit').value = food.unit;

        fillNutritionFields(food);
        document.getElementById('foodSuggestions').style.display = 'none';
    }

    function recalculateMacros() {
        if (!selectedFoodBase) return;
        fillNutritionFields(selectedFoodBase);
    }

    function goToLibrary() {
        document.getElementById('foodSuggestions').style.display = 'none';
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.getElementById('libraryTab').classList.add('active');
        document.querySelectorAll('.tab').forEach(tab => {
            if (tab.textContent.trim() === '📚 Food Library') tab.classList.add('active');
        });
        renderLibrary();
    }

    document.addEventListener('click', function(e) {
        const foodInput = document.getElementById('foodName');
        const suggestions = document.getElementById('foodSuggestions');
        if (foodInput && !foodInput.contains(e.target)) {
            suggestions.style.display = 'none';
        }
    });

    // ============================
    // NUTRITION FIELDS
    // ============================
    function fillNutritionFields(nutrition) {
        // Get user entered portion amount
        const userAmount = parseFloat(document.getElementById('portionAmount').value) || 1;

        // Calculate multiplier
        const multiplier = userAmount / nutrition.baseAmount;

        // Fill fields with multiplied values
        document.getElementById('calories').value = Math.round(nutrition.calories * multiplier);
        document.getElementById('protein').value = Math.round(nutrition.protein * multiplier * 10) / 10;
        document.getElementById('carbs').value = Math.round(nutrition.carbs * multiplier * 10) / 10;
        document.getElementById('fats').value = Math.round(nutrition.fats * multiplier * 10) / 10;
        document.getElementById('fiber').value = Math.round((nutrition.fiber || 0) * multiplier * 10) / 10;

        // Auto select the unit in the dropdown
        document.getElementById('portionUnit').value = nutrition.unit;

        // Hide save bar since food was found
        document.getElementById('saveNutritionBar').style.display = 'none';
    }

    function dismissSaveBar() {
        document.getElementById('saveNutritionBar').style.display = 'none';
    }

    function saveToDatabase() {
        const foodName = document.getElementById('foodName').value.trim();
        const portionUnit = document.getElementById('portionUnit').value;

        if (!portionUnit) { alert('Please select a portion unit before saving!'); return; }
        if (!foodName) { alert('Please enter a food name first!'); return; }

        const baseAmount = portionUnit === 'grams' ? 100 : 1;

        const nutrition = {
            unit: portionUnit,
            baseAmount: baseAmount,
            calories: parseFloat(document.getElementById('calories').value) || 0,
            protein: parseFloat(document.getElementById('protein').value) || 0,
            carbs: parseFloat(document.getElementById('carbs').value) || 0,
            fats: parseFloat(document.getElementById('fats').value) || 0,
            fiber: parseFloat(document.getElementById('fiber').value) || 0
        };

        if (nutrition.calories === 0) { alert('Please enter at least the calories before saving!'); return; }

        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
        savedNutrition[foodName.toLowerCase()] = nutrition;
        localStorage.setItem('nutritionDatabase', JSON.stringify(savedNutrition));

        document.getElementById('saveNutritionBar').style.display = 'none';
        alert(`"${foodName}" saved to your database! ✅ Next time you search it, it will auto-fill.`);
    }

    // ============================
    // GOALS FUNCTIONS
    // ============================
    function toggleGoalsForm() {
        const form = document.getElementById('goalsForm');
        const btn = document.getElementById('goalsToggleBtn');

        if (form.style.display === 'none') {
            const goals = JSON.parse(localStorage.getItem('nutritionGoals')) || {};
            if (goals.calories) document.getElementById('goalCalories').value = goals.calories;
            if (goals.protein) document.getElementById('goalProtein').value = goals.protein;
            if (goals.carbs) document.getElementById('goalCarbs').value = goals.carbs;
            if (goals.fats) document.getElementById('goalFats').value = goals.fats;
            if (goals.fiber) document.getElementById('goalFiber').value = goals.fiber;

            form.style.display = 'block';
            btn.textContent = '✖️ Cancel';
        } else {
            form.style.display = 'none';
            btn.textContent = '✏️ Edit Goals';
        }
    }

    function saveGoals() {
        const goals = {
            calories: parseFloat(document.getElementById('goalCalories').value) || 0,
            protein: parseFloat(document.getElementById('goalProtein').value) || 0,
            carbs: parseFloat(document.getElementById('goalCarbs').value) || 0,
            fats: parseFloat(document.getElementById('goalFats').value) || 0,
            fiber: parseFloat(document.getElementById('goalFiber').value) || 0
        };

        if (goals.calories === 0) { alert('Please enter at least your daily calorie goal!'); return; }

        localStorage.setItem('nutritionGoals', JSON.stringify(goals));
        document.getElementById('goalsForm').style.display = 'none';
        document.getElementById('goalsToggleBtn').textContent = '✏️ Edit Goals';

        alert('Goals saved! 🎯');
        renderSummary();
    }

    function renderGoalsDisplay(totals) {
        const goals = JSON.parse(localStorage.getItem('nutritionGoals')) || {};
        const goalsDisplay = document.getElementById('goalsDisplay');

        if (!goals.calories) {
            goalsDisplay.innerHTML = '<p style="color: #999; font-size: 14px;">No goals set yet. Click "Edit Goals" to set your daily targets!</p>';
            return;
        }

        function createProgressBar(label, current, goal, unit) {
            const percentage = Math.min((current / goal) * 100, 100);
            const actualPercentage = (current / goal) * 100;
            let color = '#28a745';
            if (actualPercentage >= 90) color = '#fd7e14';
            if (actualPercentage >= 100) color = '#dc3545';

            return `
                <div style="margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span style="font-weight: 600; color: #333;">${label}</span>
                        <span style="color: #666; font-size: 14px;">
                            ${current} / ${goal} ${unit}
                            <span style="color: ${color}; font-weight: 600;">(${Math.round(actualPercentage)}%)</span>
                        </span>
                    </div>
                    <div style="background: #e0e0e0; border-radius: 25px; height: 12px;">
                        <div style="background: ${color}; width: ${percentage}%; height: 12px; border-radius: 25px; transition: width 0.5s ease;"></div>
                    </div>
                </div>
            `;
        }

        goalsDisplay.innerHTML = `
            ${createProgressBar('🔥 Calories', totals.calories, goals.calories, 'kcal')}
            ${createProgressBar('💪 Protein', totals.protein, goals.protein, 'g')}
            ${createProgressBar('🍚 Carbs', totals.carbs, goals.carbs, 'g')}
            ${createProgressBar('🧈 Fats', totals.fats, goals.fats, 'g')}
            ${createProgressBar('🌾 Fiber', totals.fiber, goals.fiber, 'g')}
        `;
    }

    // ============================
    // FORM SUBMISSION
    // ============================
   // Initialize Flatpickr date picker
    flatpickr('#datetime', {
        dateFormat: 'Y-m-d',        // How it's stored (YYYY-MM-DD)
        altInput: true,             // Show a friendly format to user
        altFormat: 'D, d M Y',     // What user sees e.g. "Sat, 14 Feb 2026"
        defaultDate: 'today',       // Auto selects today
        maxDate: 'today',           // Can't pick future dates
        disableMobile: true         // Use Flatpickr on mobile too
    });

    let foods = JSON.parse(localStorage.getItem('foods')) || [];

    document.getElementById('foodForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const food = {
            id: Date.now(),
            datetime: document.getElementById('datetime').value,
            name: document.getElementById('foodName').value,
            portionAmount: document.getElementById('portionAmount').value,
            portionUnit: document.getElementById('portionUnit').value,
            mealType: document.getElementById('mealType').value,
            calories: parseFloat(document.getElementById('calories').value) || 0,
            protein: parseFloat(document.getElementById('protein').value) || 0,
            carbs: parseFloat(document.getElementById('carbs').value) || 0,
            fats: parseFloat(document.getElementById('fats').value) || 0,
            fiber: parseFloat(document.getElementById('fiber').value) || 0,
            notes: document.getElementById('notes').value
        };

        foods.unshift(food);
        localStorage.setItem('foods', JSON.stringify(foods));

        this.reset();
        selectedFoodBase = null;

        // Reset Flatpickr to today after form submit
        flatpickr('#datetime', {
            dateFormat: 'Y-m-d',
            altInput: true,
            altFormat: 'D, d M Y',
            defaultDate: 'today',
            maxDate: 'today',
            disableMobile: true
        });
        alert('Food logged! 🍽️');
    });

    // ============================
    // FOOD LIBRARY CRUD
    // ============================
    function renderLibrary() {
        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
        const libraryList = document.getElementById('libraryList');
        const searchInput = document.getElementById('librarySearch');
        const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';

        if (Object.keys(savedNutrition).length === 0) {
            libraryList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No foods in your library yet. Add one above!</p>';
            return;
        }

        const filteredFoods = Object.keys(savedNutrition).filter(foodName =>
            foodName.toLowerCase().includes(searchTerm)
        );

        if (filteredFoods.length === 0) {
            libraryList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No foods found matching your search!</p>';
            return;
        }

        let html = '';
        for (const foodName of filteredFoods) {
            const food = savedNutrition[foodName];
            html += `
                <div class="food-item" id="library-${foodName}">
                    <div class="food-header">
                        <span class="food-name">${foodName}</span>
                        <span class="meal-badge">${food.baseAmount} ${food.unit}</span>
                    </div>
                    <div class="food-details">
                        🔥 ${food.calories} kcal &nbsp;|&nbsp;
                        💪 ${food.protein}g protein &nbsp;|&nbsp;
                        🍚 ${food.carbs}g carbs &nbsp;|&nbsp;
                        🧈 ${food.fats}g fats &nbsp;|&nbsp;
                        🌾 ${food.fiber || 0}g fiber
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button onclick="editFood('${foodName}')" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">✏️ Edit</button>
                        <button onclick="deleteFood('${foodName}')" style="padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 8px; cursor: pointer;">🗑️ Delete</button>
                    </div>
                </div>
            `;
        }
        libraryList.innerHTML = html;
    }

    function addToLibrary() {
        const foodName = document.getElementById('libraryFoodName').value.trim();
        const unit = document.getElementById('libraryUnit').value;
        const calories = parseFloat(document.getElementById('libraryCalories').value) || 0;
        const protein = parseFloat(document.getElementById('libraryProtein').value) || 0;
        const carbs = parseFloat(document.getElementById('libraryCarbs').value) || 0;
        const fats = parseFloat(document.getElementById('libraryFats').value) || 0;
        const fiber = parseFloat(document.getElementById('libraryFiber').value) || 0;

        if (!foodName) { alert('Please enter a food name!'); return; }
        if (!unit) { alert('Please select a unit!'); return; }
        if (calories === 0) { alert('Please enter at least the calories!'); return; }

        const baseAmount = unit === 'grams' ? 100 : 1;
        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};

        if (savedNutrition[foodName.toLowerCase()]) {
            const overwrite = confirm(`"${foodName}" already exists. Overwrite?`);
            if (!overwrite) return;
        }

        savedNutrition[foodName.toLowerCase()] = { unit, baseAmount, calories, protein, carbs, fats, fiber };
        localStorage.setItem('nutritionDatabase', JSON.stringify(savedNutrition));

        document.getElementById('libraryFoodName').value = '';
        document.getElementById('libraryUnit').value = '';
        document.getElementById('libraryCalories').value = '';
        document.getElementById('libraryProtein').value = '';
        document.getElementById('libraryCarbs').value = '';
        document.getElementById('libraryFats').value = '';
        document.getElementById('libraryFiber').value = '';

        alert(`"${foodName}" added to your Food Library! 📚`);
        renderLibrary();
    }

    function deleteFood(foodName) {
        if (!confirm(`Delete "${foodName}" from your library?`)) return;
        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
        delete savedNutrition[foodName];
        localStorage.setItem('nutritionDatabase', JSON.stringify(savedNutrition));
        alert(`"${foodName}" deleted!`);
        renderLibrary();
    }

    function editFood(foodName) {
        const savedNutrition = JSON.parse(localStorage.getItem('nutritionDatabase')) || {};
        const food = savedNutrition[foodName];

        document.getElementById('libraryFoodName').value = foodName;
        document.getElementById('libraryUnit').value = food.unit;
        document.getElementById('libraryCalories').value = food.calories;
        document.getElementById('libraryProtein').value = food.protein;
        document.getElementById('libraryCarbs').value = food.carbs;
        document.getElementById('libraryFats').value = food.fats;
        document.getElementById('libraryFiber').value = food.fiber || 0;

        delete savedNutrition[foodName];
        localStorage.setItem('nutritionDatabase', JSON.stringify(savedNutrition));
        renderLibrary();

        document.getElementById('libraryFoodName').scrollIntoView({ behavior: 'smooth' });
        alert(`Editing "${foodName}" - make your changes and click Add to Library to save!`);
    }

    // ============================
    // HISTORY & CALENDAR
    // ============================
    function renderHistory() {
        const foods = JSON.parse(localStorage.getItem('foods')) || [];
        const foodsList = document.getElementById('foodsList');

        if (foods.length === 0) {
            foodsList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No foods logged yet. Start logging!</p>';
            return;
        }

        let html = '';
        foods.forEach(food => {
            const date = new Date(food.datetime);
            const formattedDate = date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            const formattedTime = date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

            html += `
                <div class="food-item">
                    <div class="food-header">
                        <span class="food-name">${food.name}</span>
                        <span class="meal-badge">${food.mealType}</span>
                    </div>
                    <div class="food-details">
                        📅 ${formattedDate} at ${formattedTime}<br>
                        🍽️ ${food.portionAmount} ${food.portionUnit}<br>
                        🔥 ${food.calories} kcal &nbsp;|&nbsp;
                        💪 ${food.protein}g protein &nbsp;|&nbsp;
                        🍚 ${food.carbs}g carbs &nbsp;|&nbsp;
                        🧈 ${food.fats}g fats &nbsp;|&nbsp;
                        🌾 ${food.fiber || 0}g fiber
                    </div>
                    <div style="margin-top: 10px;">
                        <button onclick="deleteEntry(${food.id})" style="padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 25px; cursor: pointer;">🗑️ Delete</button>
                    </div>
                </div>
            `;
        });

        foodsList.innerHTML = html;
    }

    function deleteEntry(id) {
        if (!confirm('Delete this entry?')) return;
        let foods = JSON.parse(localStorage.getItem('foods')) || [];
        foods = foods.filter(food => food.id !== id);
        localStorage.setItem('foods', JSON.stringify(foods));
        renderHistory();
    }

    let currentCalendarDate = new Date();

    function renderCalendar() {
        const foods = JSON.parse(localStorage.getItem('foods')) || [];
        const today = new Date();
        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();

        document.getElementById('calendarTitle').textContent = currentCalendarDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

        const loggedDates = new Set(foods.map(food => food.datetime.split('T')[0]));
        const firstDay = new Date(year, month, 1);
        let startDayOfWeek = firstDay.getDay();
        startDayOfWeek = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        let html = '';
        for (let i = 0; i < startDayOfWeek; i++) html += '<div></div>';

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dateObj = new Date(year, month, day);
            const isToday = dateStr === today.toISOString().split('T')[0];
            const isPast = dateObj < today && !isToday;
            const hasFood = loggedDates.has(dateStr);

            let bgColor = '#e0e0e0';
            let textColor = '#999';
            let cursor = 'default';

            if (hasFood) { bgColor = '#d4edda'; textColor = '#28a745'; cursor = 'pointer'; }
            else if (isPast) { bgColor = '#ffcccc'; textColor = '#cc0000'; }
            if (isToday) { bgColor = '#d4edda'; textColor = '#155724'; }

            const border = isToday ? '3px solid #28a745' : '3px solid transparent';

            html += `
                <div onclick="${hasFood ? `viewDaySummary('${dateStr}')` : ''}"
                    style="text-align: center; padding: 8px 4px; border-radius: 8px; background: ${bgColor}; color: ${textColor}; font-weight: ${isToday ? 'bold' : 'normal'}; border: ${border}; cursor: ${cursor}; font-size: 14px;">
                    ${day}
                </div>
            `;
        }

        document.getElementById('calendarGrid').innerHTML = html;
    }

    function changeMonth(direction) {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
        renderCalendar();
    }

    function viewDaySummary(dateStr) {
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.getElementById('summaryTab').classList.add('active');
        document.querySelectorAll('.tab').forEach(tab => {
            if (tab.textContent.trim() === 'Summary') tab.classList.add('active');
        });
        renderSummary(dateStr);
    }

    // ============================
    // SUMMARY
    // ============================
    function renderSummary(date) {
        const foods = JSON.parse(localStorage.getItem('foods')) || [];
        const summaryDiv = document.getElementById('dailySummary');
        const selectedDate = date || new Date().toISOString().split('T')[0];
        const todaysFoods = foods.filter(food => food.datetime.startsWith(selectedDate));

        renderGoalsDisplay({ calories: 0, protein: 0, carbs: 0, fats: 0, fiber: 0 });

        if (todaysFoods.length === 0) {
            summaryDiv.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No foods logged for this day yet!</p>';
            return;
        }

        const totals = todaysFoods.reduce((acc, food) => {
            acc.calories += food.calories || 0;
            acc.protein += food.protein || 0;
            acc.carbs += food.carbs || 0;
            acc.fats += food.fats || 0;
            acc.fiber += food.fiber || 0;
            return acc;
        }, { calories: 0, protein: 0, carbs: 0, fats: 0, fiber: 0 });

        Object.keys(totals).forEach(key => {
            totals[key] = Math.round(totals[key] * 10) / 10;
        });

        renderGoalsDisplay(totals);

        const mealGroups = {};
        todaysFoods.forEach(food => {
            if (!mealGroups[food.mealType]) {
                mealGroups[food.mealType] = { foods: [], calories: 0, protein: 0, carbs: 0, fats: 0, fiber: 0 };
            }
            mealGroups[food.mealType].foods.push(food);
            mealGroups[food.mealType].calories += food.calories || 0;
            mealGroups[food.mealType].protein += food.protein || 0;
            mealGroups[food.mealType].carbs += food.carbs || 0;
            mealGroups[food.mealType].fats += food.fats || 0;
            mealGroups[food.mealType].fiber += food.fiber || 0;
        });

        const todayFormatted = new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-IN', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });

        let html = `
            <p style="color: #999; margin-bottom: 20px;">${todayFormatted}</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;">
                <div class="summary-card">
                    <div class="summary-label">🔥 Total Calories</div>
                    <div class="summary-value">${totals.calories}</div>
                    <div class="summary-label">kcal</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">💪 Protein</div>
                    <div class="summary-value">${totals.protein}g</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">🍚 Carbs</div>
                    <div class="summary-value">${totals.carbs}g</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">🧈 Fats</div>
                    <div class="summary-value">${totals.fats}g</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">🌾 Fiber</div>
                    <div class="summary-value">${totals.fiber}g</div>
                </div>
            </div>
            <h3 style="color: #667eea; margin-bottom: 15px;">Breakdown by Meal</h3>
        `;

        for (const mealType in mealGroups) {
            const meal = mealGroups[mealType];
            html += `
                <div class="food-item" style="margin-bottom: 15px;">
                    <div class="food-header">
                        <span class="food-name">${mealType}</span>
                        <span class="meal-badge">🔥 ${Math.round(meal.calories)} kcal</span>
                    </div>
                    <div class="food-details" style="margin-bottom: 8px;">
                        💪 ${Math.round(meal.protein * 10) / 10}g protein &nbsp;|&nbsp;
                        🍚 ${Math.round(meal.carbs * 10) / 10}g carbs &nbsp;|&nbsp;
                        🧈 ${Math.round(meal.fats * 10) / 10}g fats &nbsp;|&nbsp;
                        🌾 ${Math.round(meal.fiber * 10) / 10}g fiber
                    </div>
                    <div style="border-top: 1px solid #e0e0e0; padding-top: 8px;">
                        ${meal.foods.map(food => `
                            <div style="color: #666; font-size: 13px; padding: 3px 0;">
                                • ${food.name} (${food.portionAmount} ${food.portionUnit}) - ${food.calories} kcal
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        summaryDiv.innerHTML = html;
    }

</script>
</body>
</html>
